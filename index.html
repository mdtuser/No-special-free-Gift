<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Click Task</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #020617, #1e1b4b, #312e81);
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      text-align: center;
      border-radius: 24px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(15px);
      box-shadow: 0 25px 60px rgba(0,0,0,.45);
    }

    .icon {
      font-size: 42px;
      margin-bottom: 18px;
    }

    h1 {
      color: #fff;
      font-size: 27px;
      margin-bottom: 12px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
      font-size: 15px;
      margin-bottom: 28px;
    }

    #clickBtn {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(90deg, #4f46e5, #8b5cf6);
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    #clickBtn:active {
      transform: scale(.97);
    }

    #clickBtn:disabled {
      background: #374151;
      color: #9ca3af;
      cursor: not-allowed;
    }

    #success {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 14px;
      color: #86efac;
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.3);
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">👆</div>

    <h1>একবার ক্লিক করুন</h1>

    <p>
     নিচের বাটনে দুইবার কি তিনবার ক্লিক করা লাগতে পারে একদম সহজ কাজ এত সহজ কাজ এখন পর্যন্ত আর হয়নি কোন অ্যাড আসলে ভিতর থেকে ঘুরে আসবেন যদি ভুলেও ইন্সটল করে থাকেন ওপেন করবেন না।
    </p>

    <button id="clickBtn" type="button">
      CLICK HERE
    </button>
<script async="async" data-cfasync="false" src="https://pl30742970.effectivecpmnetwork.com/dc4530ba3390a59edc8e1d7a5d5d3358/invoke.js"></script>
<div id="container-dc4530ba3390a59edc8e1d7a5d5d3358"></div>

    <div id="success">
      ✅ কাজ সফলভাবে সম্পন্ন হয়েছে!
    </div>

  </div>

  <!-- প্রথম বিজ্ঞাপনের স্ক্রিপ্ট -->
  <script src="https://pl30742972.effectivecpmnetwork.com/99/d8/99/99d899bef6d7fd04276f04e29f36d0ef.js"></script>

  <script>
    const button = document.getElementById("clickBtn");
    const success = document.getElementById("success");

    let clickCount = 0;
    let secondAdLoaded = false;

    button.addEventListener("click", function () {

      clickCount++;

      // প্রথম ক্লিক
      if (clickCount === 1) {

        // দ্বিতীয় বিজ্ঞাপনের স্ক্রিপ্ট লোড
        if (!secondAdLoaded) {

          const adScript = document.createElement("script");

          adScript.src =
            "https://pl30921057.effectivecpmnetwork.com/95/2a/4f/952a4f8c0ef40f547213fbbdb089f31d.js";

          adScript.async = true;

          document.body.appendChild(adScript);

          secondAdLoaded = true;
        }

        button.textContent = "CLICK AGAIN";
      }

      // দ্বিতীয় ক্লিক
      else if (clickCount === 2) {

        button.textContent = "COMPLETED ✓";
        button.disabled = true;

        success.style.display = "block";
      }

    });
  </script>
</body>
</html>
